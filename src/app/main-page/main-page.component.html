@for (post of posts(); track post.username) {
  <article class="post-card">
    <!-- Header: Profilbild & Username -->
    <header class="post-header">
      <img
        class="avatar"
        [src]="post.avatar"
        [alt]="'Profilbild von ' + post.username"
        width="40"
        height="40"
      />
      <span class="username">{{ post.username }}</span>
    </header>

    <!-- Image -->
    <div class="post-image-container">
      <img
        class="post-image"
        [src]="post.img"
        [alt]="'Beitrag von ' + post.username"
        width="600"
        height="600"
      />
    </div>

    <!-- Actions (Likes, Comments, Share) -->
    <div class="post-actions">
      <button type="button" class="action-btn" aria-label="Gefällt mir">❤️</button>
      <button type="button" class="action-btn" aria-label="Kommentieren">💬</button>
      <button type="button" class="action-btn" aria-label="Teilen">✈️</button>
    </div>

    <!-- Content / Caption -->
    <div class="post-content">
      <p class="likes-count"><strong>{{ post.likes }} Gefällt mir-Angaben</strong></p>
      <p class="caption">
        <strong>{{ post.username }}</strong> {{ post.caption }}
      </p>
    </div>
  </article>
}
